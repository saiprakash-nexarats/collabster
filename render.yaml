services:
  - type: web
    name: collobster-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COLLOBSTER_CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,https://*.pages.dev,http://localhost:5173"
      - key: COLLABSTER_SYSTEM_HEALTH_CACHE_REQUIRED
        value: "false"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: PORT
        value: "8080"
