# ===========================
# Profiles & Defaults
# ===========================
spring.profiles.default=${SPRING_PROFILES_DEFAULT:prod}

# ===========================
# Server & Port
# ===========================
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ===========================
# Database & Datasource Config
# ===========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/collabster1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false

# ===========================
# Hikari Connection Pool Config (Phase 11 Audited)
# Sizing Math: 3 app nodes * 20 conn = 60 conn + 15 Python pool + 22 reserved = 97 <= 100 max_connections
# ===========================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_MS:10000}

# ===========================
# HTTP Response Compression (Phase 11)
# Bounded to JSON/text payloads >= 2KB to avoid overhead on small responses
# ===========================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=2048

# ===========================
# Communities Module Config
# ===========================

# Flyway - database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}

# Redis - caching and rate limit state
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL_ENABLED:false}

# Community feature tuning
collabster.communities.fan-out-threshold=1000
collabster.communities.activity-decay-factor=0.95
collabster.communities.rate-limit.posts-per-minute=5
collabster.communities.rate-limit.comments-per-minute=15
collabster.communities.rate-limit.local-fallback-enabled=${COMMUNITY_RATE_LIMIT_LOCAL_FALLBACK_ENABLED:false}
collabster.communities.ai-moderation.mock-enabled=${COMMUNITY_AI_MODERATION_MOCK_ENABLED:false}
collabster.communities.ai-moderation.provider=${COMMUNITY_AI_MODERATION_PROVIDER:none}
collabster.communities.ai-moderation.http.endpoint=${COMMUNITY_AI_MODERATION_HTTP_ENDPOINT:}
collabster.communities.ai-moderation.http.api-key=${COMMUNITY_AI_MODERATION_HTTP_API_KEY:}
collabster.communities.ai-moderation.http.timeout-ms=${COMMUNITY_AI_MODERATION_HTTP_TIMEOUT_MS:1500}
collabster.communities.ai-moderation.openai.api-key=${OPENAI_API_KEY:}
collabster.communities.ai-moderation.openai.endpoint=${OPENAI_MODERATION_ENDPOINT:https://api.openai.com/v1/moderations}
collabster.communities.ai-moderation.openai.model=${OPENAI_MODERATION_MODEL:omni-moderation-latest}
collabster.communities.ai-moderation.openai.timeout-ms=${OPENAI_MODERATION_TIMEOUT_MS:2000}
collabster.communities.websocket.allowed-origins=${COMMUNITY_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:*}
collabster.communities.websocket.relay.enabled=${COMMUNITY_WEBSOCKET_RELAY_ENABLED:false}
collabster.communities.websocket.relay.host=${COMMUNITY_WEBSOCKET_RELAY_HOST:localhost}
collabster.communities.websocket.relay.port=${COMMUNITY_WEBSOCKET_RELAY_PORT:61613}
collabster.communities.websocket.relay.client-login=${COMMUNITY_WEBSOCKET_RELAY_CLIENT_LOGIN:guest}
collabster.communities.websocket.relay.client-passcode=${COMMUNITY_WEBSOCKET_RELAY_CLIENT_PASSCODE:guest}
collabster.communities.websocket.relay.system-login=${COMMUNITY_WEBSOCKET_RELAY_SYSTEM_LOGIN:guest}
collabster.communities.websocket.relay.system-passcode=${COMMUNITY_WEBSOCKET_RELAY_SYSTEM_PASSCODE:guest}

# ===========================
# JWT Secret Key
# ===========================
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# ===========================
# Mail Config (Local Fallback)
# ===========================
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===========================
# File Storage Config (Madhuri's Startup Module)
# ===========================
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
collabster.storage.public-base-url=${COLLABSTER_STORAGE_PUBLIC_BASE_URL:}
collabster.storage.signing-secret=${COLLABSTER_STORAGE_SIGNING_SECRET:}

# ===========================
# OAuth2 Social Login Config (Madhuri's OAuth2 Module)
# ===========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# ===========================
# Recommendation Module Config (Phase 4 & 5.2 Resilience)
# ===========================
collobster.recommendation.enabled=${COLLOBSTER_RECOMMENDATION_ENABLED:false}
collobster.recommendation.base-url=${COLLOBSTER_RECOMMENDATION_BASE_URL:http://localhost:8000}
collobster.recommendation.internal-token=${COLLOBSTER_RECOMMENDATION_INTERNAL_TOKEN:}
collobster.recommendation.feedback.internal-token=${COLLOBSTER_RECOMMENDATION_INTERNAL_TOKEN:${collobster.recommendation.internal-token:}}
collobster.recommendation.connect-timeout-ms=${COLLOBSTER_RECOMMENDATION_CONNECT_TIMEOUT_MS:500}
collobster.recommendation.read-timeout-ms=${COLLOBSTER_RECOMMENDATION_READ_TIMEOUT_MS:1000}
collobster.recommendation.max-concurrent-requests=${COLLOBSTER_RECOMMENDATION_MAX_CONCURRENT_REQUESTS:20}
collobster.recommendation.bulkhead-acquire-timeout-ms=${COLLOBSTER_RECOMMENDATION_BULKHEAD_ACQUIRE_TIMEOUT_MS:250}
collobster.recommendation.max-connections=${collobster.recommendation.max-concurrent-requests}
collobster.recommendation.max-candidates=${COLLOBSTER_RECOMMENDATION_MAX_CANDIDATES:500}
collobster.recommendation.fallback-enabled=${COLLOBSTER_RECOMMENDATION_FALLBACK_ENABLED:true}

# Feedback client bulkhead & transport
collobster.recommendation.feedback.max-concurrent-requests=${COLLOBSTER_RECOMMENDATION_FEEDBACK_MAX_CONCURRENT_REQUESTS:10}
collobster.recommendation.feedback.bulkhead-acquire-timeout-ms=${COLLOBSTER_RECOMMENDATION_FEEDBACK_BULKHEAD_ACQUIRE_TIMEOUT_MS:500}
collobster.recommendation.feedback.max-connections=${collobster.recommendation.feedback.max-concurrent-requests}

# Privacy erasure client bulkhead & transport
collobster.recommendation.privacy.base-url=${collobster.recommendation.base-url}
collobster.recommendation.privacy.internal-token=${collobster.recommendation.internal-token}
collobster.recommendation.privacy.max-concurrent-requests=${COLLOBSTER_RECOMMENDATION_PRIVACY_MAX_CONCURRENT_REQUESTS:5}
collobster.recommendation.privacy.bulkhead-acquire-timeout-ms=${COLLOBSTER_RECOMMENDATION_PRIVACY_BULKHEAD_ACQUIRE_TIMEOUT_MS:1000}
collobster.recommendation.privacy.connect-timeout-ms=${COLLOBSTER_RECOMMENDATION_PRIVACY_CONNECT_TIMEOUT_MS:3000}
collobster.recommendation.privacy.read-timeout-ms=${COLLOBSTER_RECOMMENDATION_PRIVACY_READ_TIMEOUT_MS:5000}

collobster.recommendation.circuit-breaker.enabled=${COLLOBSTER_RECOMMENDATION_CB_ENABLED:true}
collobster.recommendation.circuit-breaker.failure-rate-threshold=${COLLOBSTER_RECOMMENDATION_CB_FAILURE_RATE_THRESHOLD:50.0}
collobster.recommendation.circuit-breaker.sliding-window-size=${COLLOBSTER_RECOMMENDATION_CB_SLIDING_WINDOW_SIZE:5}
collobster.recommendation.circuit-breaker.minimum-number-of-calls=${COLLOBSTER_RECOMMENDATION_CB_MIN_CALLS:3}
collobster.recommendation.circuit-breaker.wait-duration-in-open-state-ms=${COLLOBSTER_RECOMMENDATION_CB_WAIT_DURATION_MS:10000}
collobster.recommendation.circuit-breaker.permitted-number-of-calls-in-half-open-state=${COLLOBSTER_RECOMMENDATION_CB_HALF_OPEN_CALLS:2}

# ===========================
# Security & Error Handling
# ===========================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
collobster.cors.allowed-origins=${COLLOBSTER_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,https://*.vercel.app}
collobster.frontend.url=${COLLOBSTER_FRONTEND_URL:${FRONTEND_URL:http://localhost:5173}}


