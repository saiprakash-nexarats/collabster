# ==============================================================================
# Collobster Spring Boot Development Profile (application-dev.properties)
# High-productivity in-memory mode for frictionless local testing and dev
# ==============================================================================

server.port=8080

# --- Embedded H2 in PostgreSQL Mode ---
spring.datasource.url=jdbc:h2:mem:collobster_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

# --- H2 Web Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Connection Pool ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

# --- Response Compression ---
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# --- CORS Allowed Origins ---
collobster.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080

# --- JWT Configuration ---
jwt.secret=${JWT_SECRET:local-development-only-change-me-before-sharing}
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# --- Communities & Moderation Mocks ---
collabster.communities.rate-limit.local-fallback-enabled=true
collabster.communities.ai-moderation.mock-enabled=true
collabster.communities.ai-moderation.provider=none
collabster.communities.fan-out-threshold=1000
collabster.communities.activity-decay-factor=0.95

# --- Local Storage ---
file.upload-dir=uploads
collabster.storage.public-base-url=http://localhost:8080/uploads
collabster.storage.signing-secret=${COLLABSTER_STORAGE_SIGNING_SECRET:local-development-only-change-me}

# --- WebSocket ---
collabster.communities.websocket.allowed-origins=http://localhost:*
collabster.communities.websocket.relay.enabled=false
