# GitHub Actions CI Workflow for Collobster
# To enable this workflow on GitHub Actions, grant the `workflow` scope to your GitHub token
# or copy this file to `.github/workflows/ci.yml` directly in the GitHub web interface.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Test & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080

  backend:
    name: Backend (Compile & Unit Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: collabsphere
          POSTGRES_USER: collabsphere
          POSTGRES_PASSWORD: collabsphere_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and run core unit tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/collabsphere
          SPRING_DATASOURCE_USERNAME: collabsphere
          SPRING_DATASOURCE_PASSWORD: collabsphere_secret
        run: mvn -B test -Dtest=AuthenticationSecurityHardeningTest,AuthenticationDatabaseIntegrationTest,WebSocketSecurityTest,MessagingWebSocketSecurityTest,MultiDeviceLogoutTest,AccountWideSessionRevocationTest,AccountLifecycleIntegrationTest,SystemHealthControllerTest,MessagingMembershipAuthorizationTest,CommunityEventParityTest,StorageManagementServiceTest,StorageControllerTest,StorageSecurityAndHardeningTest,StorageDatabaseIntegrationTest,StorageSecurityChainIntegrationTest,ProjectServiceTest,CompanyServiceTest,ProjectControllerTest,CompanyControllerTest,ProjectsAndCompaniesDatabaseIntegrationTest,ProjectsAndCompaniesPostgreSqlIntegrationTest,ProjectSecurityAuthorizationTest,CompanyDocumentSecurityTest
